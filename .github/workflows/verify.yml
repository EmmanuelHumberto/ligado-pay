name: Verify payment gateway
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: ligado_pay_test
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ligado_pay_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run contract:check
      - run: npm run test:integration
        env:
          LIGADO_PAY_TEST_ADMIN_URL: postgresql://postgres:ci-ephemeral-only@127.0.0.1:55439/ligado_pay_test
      - run: npm audit --audit-level=low
