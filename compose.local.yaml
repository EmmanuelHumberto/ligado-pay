name: ligado-pay-local
services:
  postgres:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: postgres
    env_file: .local/postgres.env
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - ligado-pay-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 150
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ligado_pay_local"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  ligado-pay-data:
